<!doctype html>
<html lang="en">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- partial "search.html" . }}
  {{- $js := resources.Get "js/main.js" | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- block "scripts" . }}{{ end }}
</body>
</html>
