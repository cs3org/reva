syntax = "proto3";

// Package reva.control.v1beta1 is the per-process control channel: a small
// gRPC service, hosted on its own port by every reva process, that runs
// invocations locally. It is independent of the Admin API.
package reva.control.v1beta1;

option go_package = "github.com/cs3org/reva/v3/pkg/control/controlpb";

// Control exposes a process's invocations. One server fronts the whole
// process; the target field routes to the addressed instance.
service Control {
  rpc ListInvocations(ListInvocationsRequest) returns (ListInvocationsResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // InvokeStream is the streaming twin of Invoke, for invocations that emit a
  // stream of results.
  rpc InvokeStream(InvokeRequest) returns (stream InvokeResponse);
}

message ArgSpec {
  string name = 1;
  string description = 2;
  bool required = 3;
  // type is string, int, uint, bool, float, duration or time, or the Go name
  // of a type that parses itself (an encoding.TextUnmarshaler).
  string type = 4;
  // repeated reports a list: one argument with comma-separated values.
  bool repeated = 5;
  // default is the value of an absent argument. Empty means none.
  string default = 6;
  // enum lists the only values that the argument accepts. Empty means any.
  repeated string enum = 7;
}

message InvocationSpec {
  string name = 1;
  string description = 2;
  repeated ArgSpec args = 3;
  // kind is readonly|mutating|dangerous, used for audit and gating.
  string kind = 4;
  // streaming reports the invocation emits a stream of results (via
  // InvokeStream) rather than a single one (Invoke).
  bool streaming = 5;
  // scope is empty when every instance runs the invocation, or "shared" when
  // one instance per service runs it.
  string scope = 6;
  // stream_only reports a streaming invocation without a single-result form:
  // it runs only through InvokeStream.
  bool stream_only = 7;
}

message ListInvocationsRequest {
  // target is the node id "host:port/service" of a service instance.
  string target = 1;
}
message ListInvocationsResponse {
  repeated InvocationSpec invocations = 1;
}

message InvokeRequest {
  // target is the node id "host:port/service" of a service instance.
  string target = 1;
  string invocation = 2;
  map<string, string> args = 3;
}
message InvokeResponse {
  string result_json = 1;
  string error = 2;
  // code is the google.golang.org/grpc/codes value of error. A node that does
  // not report a code sends 0 with an error: read it as Unknown.
  int32 code = 3;
}

// The generated Go stubs are exported from pkg/control/controlpb. Regenerate
// from the repo root with `make protobuf`, or directly with:
// protoc --proto_path=pkg/control/proto \
//   --go_out=. --go_opt=module=github.com/cs3org/reva/v3 \
//   --go-grpc_out=. --go-grpc_opt=module=github.com/cs3org/reva/v3 \
//   pkg/control/proto/control.proto
