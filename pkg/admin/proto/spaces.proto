syntax = "proto3";

package reva.admin.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/spaces_api.proto";
import "cs3/types/v1beta1/types.proto";
import "google/protobuf/field_mask.proto";
import "types.proto";

option go_package = "github.com/cs3org/reva/v3/pkg/admin/adminpb";

// SpacesAdmin is the operator surface for storage spaces of any owner: the
// fleet-wide list, the space catalogue, the status and the owner of a space,
// and space quotas. Every method needs the admin scope.
//
// The catalogue is the spacesregistry. It has only project spaces today. A
// space that is not in the catalogue is NotFound, also when it exists on the
// storage.
service SpacesAdmin {
  // ListSpaces streams the spaces of the catalogue, of every owner.
  rpc ListSpaces(ListSpacesRequest) returns (stream AdminSpace);
  // GetSpace returns one space, archived or not. The CLI uses it to find out
  // if a space that the user plane did not find exists.
  rpc GetSpace(GetSpaceRequest) returns (AdminSpace);
  // UpdateSpace changes the description, the readme or the thumbnail of a
  // space, with the update fields of UpdateStorageSpace. The change is made
  // on the server as the owner of the space, with the checks of a user call.
  // It is the server side of the owner fallback.
  rpc UpdateSpace(UpdateSpaceRequest) returns (AdminSpace);
  rpc SetSpaceStatus(SetSpaceStatusRequest) returns (AdminSpace);
  rpc SetSpaceOwner(SetSpaceOwnerRequest) returns (AdminSpace);
  // RegisterSpace adds to the catalogue a space that the storage already
  // serves. It does not provision the space. Dangerous.
  rpc RegisterSpace(RegisterSpaceRequest) returns (AdminSpace);
  // UnregisterSpace removes a space from the catalogue. It does not touch the
  // data. Dangerous.
  rpc UnregisterSpace(UnregisterSpaceRequest) returns (AdminSpace);
  // CheckSpaces streams the spaces that have a problem, with their findings.
  rpc CheckSpaces(CheckSpacesRequest) returns (stream SpaceCheck);
  // GetSpaceQuota reads the quota of a space on the storage provider that
  // serves it. A space that is not in the catalogue is found by its root
  // path or by its id, which encodes the root path.
  rpc GetSpaceQuota(GetSpaceQuotaRequest) returns (SpaceQuota);
  // SetSpaceQuota sets the quota of a space, on its root. The storage
  // chooses how it keeps the quota, from the type of the space.
  rpc SetSpaceQuota(SetSpaceQuotaRequest) returns (SpaceQuota);
  // ListSpaceQuotas streams the quotas that the storage providers keep, one
  // instance for each mount.
  rpc ListSpaceQuotas(ListSpaceQuotasRequest) returns (stream SpaceQuota);

  // Reserved for the profiles of heterogeneous spaces (phase 2):
  //   rpc ListProfiles(ListProfilesRequest) returns (stream Profile);
  //   rpc GetProfile(GetProfileRequest) returns (Profile);
  //   rpc ValidateProfiles(ValidateProfilesRequest) returns (ValidateProfilesResponse);
  //   rpc GetProfileUsage(GetProfileUsageRequest) returns (GetProfileUsageResponse);
  //   rpc ExplainCapabilities(ExplainCapabilitiesRequest) returns (ExplainCapabilitiesResponse);
  //   rpc SetSpaceProfile(SetSpaceProfileRequest) returns (AdminSpace);
}

// AdminSpace is a space as an operator sees it. The path is in
// space.root_info.path, and the role groups are in space.roles.
message AdminSpace {
  cs3.storage.provider.v1beta1.StorageSpace space = 1;
  // status is the status of the space in the catalogue: creating, active,
  // archiving or archived.
  string status = 2;
  // profile is the profile of a heterogeneous space. It is empty until the
  // catalogue stores profiles.
  string profile = 3;
  // extra holds the catalogue columns that CS3 cannot carry, for example
  // created_at and archived_at (RFC 3339) of the sql driver.
  map<string, string> extra = 4;
}

// ListSpacesRequest selects spaces. As in ListStorageSpaces, filters of one
// type match any of their values, and filters of different types must all
// match. An empty field does not filter.
message ListSpacesRequest {
  // filters are CS3 filters of these types:
  //  - TYPE_SPACE_TYPE, TYPE_OWNER and TYPE_USER, at most one of each. USER
  //    keeps the spaces that the user owns or can access through a role
  //    group.
  //  - TYPE_ID and TYPE_PATH, the root path of the space.
  // Another type is InvalidArgument.
  repeated cs3.storage.provider.v1beta1.ListStorageSpacesRequest.Filter filters = 1;
  // status is the status of the space in the catalogue.
  string status = 2;
  // profile is Unimplemented until the catalogue stores profiles.
  string profile = 3;
  cs3.types.v1beta1.Timestamp created_after = 4;
  cs3.types.v1beta1.Timestamp created_before = 5;
  bool include_archived = 6;
}

message GetSpaceRequest {
  SpaceRef ref = 1;
}

// UpdateSpaceRequest changes the fields that it lists, in order. An empty
// value clears the field.
message UpdateSpaceRequest {
  SpaceRef ref = 1;
  // fields can be the description and the metadata of type TYPE_README or
  // TYPE_THUMBNAIL, whose id is the path of the file. At most one of each.
  // The catalogue cannot change an alias or a name, so they are
  // InvalidArgument, and so is a quota, which SetSpaceQuota sets.
  repeated cs3.storage.provider.v1beta1.UpdateStorageSpaceRequest.UpdateField fields = 2;
  // fallback tells the audit that the CLI used admin rights after the user
  // plane did not find the space.
  bool fallback = 3;
}

message SetSpaceStatusRequest {
  SpaceRef ref = 1;
  // status is creating, active, archiving or archived.
  string status = 2;
}

message SetSpaceOwnerRequest {
  SpaceRef ref = 1;
  cs3.identity.user.v1beta1.UserId owner = 2;
}

// RegisterSpaceRequest is a space to add to the catalogue. The catalogue can
// fill an empty field from its configuration, or refuse the request.
message RegisterSpaceRequest {
  // space is read in the form that AdminSpace returns:
  //  - name and owner, which are required. The owner is its username, else
  //    the opaque id of its id.
  //  - id, <storage id>$<space id>, or root.storage_id and root.space_id. The
  //    space id is derived from the path if it is empty.
  //  - root_info.path and description.
  //  - roles named reader, writer and admin, each with one group as its
  //    recipient. The catalogue gives each role its permissions.
  // The space type, if it is set, must be project. A quota, a readme or a
  // thumbnail is InvalidArgument: SetSpaceQuota and UpdateSpace set them.
  cs3.storage.provider.v1beta1.StorageSpace space = 1;
  // status is active if it is empty.
  string status = 2;
}

message UnregisterSpaceRequest {
  SpaceRef ref = 1;
  // hard removes the record. Without it, the record is soft-deleted and
  // keeps its name and its space id taken.
  bool hard = 2;
}

// CheckSpacesRequest selects the spaces to check. An empty field does not
// filter.
message CheckSpacesRequest {
  string status = 1;
  cs3.identity.user.v1beta1.UserId owner = 2;
}

// SpaceCheck is a space that has a problem.
message SpaceCheck {
  AdminSpace space = 1;
  repeated SpaceFinding findings = 2;
}

// SpaceFinding is one problem of a space.
message SpaceFinding {
  // kind is for example owner_missing, owner_expiring, owner_blocked,
  // path_missing, group_unset, group_missing, no_members, or <what>_error
  // when a call failed.
  string kind = 1;
  string detail = 2;
}

// SpaceQuota is the quota of a space. The bytes are logical: the size of the
// data that users see.
message SpaceQuota {
  // space is the id of the space when the catalogue has it.
  SpaceRef space = 1;
  // root is the root path of the space.
  string root = 2;
  // mount_id is the mount of the storage provider that keeps the quota.
  string mount_id = 3;
  // quota has the limits and what remains of them. A limit of 0 is no limit,
  // and then its remaining value is 0 too.
  cs3.storage.provider.v1beta1.Quota quota = 4;
  // physical_max_bytes is quota.quota_max_bytes with the copies that the
  // storage keeps of each byte.
  uint64 physical_max_bytes = 5;
  // form tells how the storage keeps the quota, for example project or user.
  string form = 6;
  string space_type = 7;
  // owner is the owner of the space, when it is known.
  cs3.identity.user.v1beta1.UserId owner = 8;
}

message GetSpaceQuotaRequest {
  SpaceRef ref = 1;
}

// SetSpaceQuotaRequest sets the limits that update_mask names. A limit of 0
// is no limit.
message SetSpaceQuotaRequest {
  SpaceRef ref = 1;
  // quota has the new limits: quota_max_bytes, in logical bytes, and
  // quota_max_files.
  cs3.storage.provider.v1beta1.Quota quota = 2;
  // update_mask is quota_max_bytes, quota_max_files or both. It is required,
  // because 0 is a limit too.
  google.protobuf.FieldMask update_mask = 3;
}

message ListSpaceQuotasRequest {
  // min_bytes keeps the quotas of at least this many logical bytes.
  uint64 min_bytes = 1;
}
