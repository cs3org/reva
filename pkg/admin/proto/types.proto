syntax = "proto3";

package reva.admin.v1beta1;

import "cs3/storage/provider/v1beta1/resources.proto";

option go_package = "github.com/cs3org/reva/v3/pkg/admin/adminpb";

// The typed admin services share these messages and these rules:
//  - A resource message wraps the CS3 message of the same resource and adds
//    only what CS3 cannot carry.
//  - A wrapper can have `map<string, string> extra` for the attributes that a
//    driver or a deployment adds. Reva core does not interpret them.
//  - A list is a server stream, so there is no paging.
//  - A message never carries a secret.
//  - The invocation of the owning service returns the protojson of the message.

// SpaceRef identifies a storage space.
message SpaceRef {
  oneof ref {
    cs3.storage.provider.v1beta1.StorageSpaceId id = 1;
    // path is a path in the space: the space is the one that holds it.
    string path = 2;
    // name is the name of the space, for example the name of a project.
    string name = 3;
  }
}
